let current=0, answers=new Array(150).fill(-1), submitted=false, reviewMode=false;

function renderGrid(){
  const g=document.getElementById('q-grid');
  g.innerHTML='';
  ALL_QUESTIONS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='q-dot'+(i===current?' current':answers[i]!==-1?(submitted&&answers[i]!==ALL_QUESTIONS[i].a?' wrong-ans':' answered'):'');
    d.textContent=i+1;
    d.onclick=()=>{current=i;render()};
    g.appendChild(d);
  });
}

function render(){
  const q=ALL_QUESTIONS[current];
  document.getElementById('qnum').textContent=`Question ${current+1} of 150 — ${q.s}`;
  document.getElementById('qtext').textContent=q.q;
  document.getElementById('s-current').textContent=current+1;
  const answered=answers.filter(a=>a!==-1).length;
  const correct=submitted?answers.filter((a,i)=>a===ALL_QUESTIONS[i].a).length:answers.filter((a,i)=>a!==-1&&a===ALL_QUESTIONS[i].a).length;
  document.getElementById('s-correct').textContent=correct;
  document.getElementById('s-score').textContent=answered>0?Math.round(correct/Math.max(answered,1)*100)+'%':'0%';
  document.getElementById('progress').style.width=(answered/150*100)+'%';
  document.getElementById('section-label').textContent=`Section: ${q.s}`;
  const opts=document.getElementById('options');
  opts.innerHTML='';
  q.o.forEach((opt,i)=>{
    const d=document.createElement('div');
    let cls='opt';
    if(submitted||reviewMode){
      if(i===q.a) cls+=' correct';
      else if(answers[current]===i&&i!==q.a) cls+=' wrong';
    } else if(answers[current]===i) cls+=' selected';
    d.className=cls;
    d.innerHTML=`<span class="opt-letter">${['A','B','C','D'][i]}.</span><span>${opt}</span>`;
    if(!submitted&&!reviewMode) d.onclick=()=>{answers[current]=i;render();renderGrid()};
    opts.appendChild(d);
  });
  const fb=document.getElementById('feedback');
  if(submitted||reviewMode){
    fb.style.display='block';
    if(answers[current]===q.a){fb.className='feedback correct';fb.textContent='Correct! '+q.o[q.a]+' is the right answer.';}
    else{fb.className='feedback wrong';fb.textContent=`Wrong. The correct answer is ${['A','B','C','D'][q.a]}. ${q.o[q.a]}`;}
  } else fb.style.display='none';
  renderGrid();
}

function prevQ(){if(current>0){current--;render();}}
function nextQ(){if(current<149){current++;render();}}

function submitAll(){
  const answered=answers.filter(a=>a!==-1).length;
  if(answered<150&&!confirm(`You have answered ${answered}/150 questions. Submit anyway?`))return;
  submitted=true;
  showResults();
}

function showResults(){
  document.getElementById('test-screen').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const total=150;
  const correct=answers.filter((a,i)=>a===ALL_QUESTIONS[i].a).length;
  const pct=Math.round(correct/total*100);
  let grade,color,bg;
  if(pct>=70){grade='Pass';color='#04342C';bg='#E1F5EE';}
  else{grade='Fail';color='#501313';bg='#FCEBEB';}
  const gc=document.getElementById('grade-circle');
  gc.style.background=bg;gc.style.color=color;
  gc.innerHTML=`<span>${pct}%</span><span style="font-size:16px">${grade}</span>`;
  document.getElementById('result-grade').textContent=`${correct} / ${total} correct`;
  document.getElementById('result-summary').textContent=`You answered ${answers.filter(a=>a!==-1).length} questions. Score: ${pct}% — ${pct>=70?'Congratulations, you passed!':'Keep studying and try again.'}`;
  const sections={};
  ALL_QUESTIONS.forEach((q,i)=>{
    if(!sections[q.s])sections[q.s]={total:0,correct:0};
    sections[q.s].total++;
    if(answers[i]===q.a)sections[q.s].correct++;
  });
  const sc=document.getElementById('section-scores');
  sc.innerHTML='<p style="font-weight:500;font-size:15px;margin-bottom:8px">Performance by section</p>';
  Object.entries(sections).forEach(([s,v])=>{
    const p=Math.round(v.correct/v.total*100);
    const row=document.createElement('div');
    row.className='section-row';
    const badgeColor=p>=70?'#E1F5EE':'#FCEBEB';
    const badgeText=p>=70?'#04342C':'#501313';
    row.innerHTML=`<span style="font-size:13px">${s}</span><span style="display:flex;gap:8px;align-items:center"><span style="font-size:13px;color:var(--color-text-secondary)">${v.correct}/${v.total}</span><span class="badge" style="background:${badgeColor};color:${badgeText}">${p}%</span></span>`;
    sc.appendChild(row);
  });
}

function reviewAnswers(){
  document.getElementById('result-screen').style.display='none';
  document.getElementById('test-screen').style.display='block';
  reviewMode=true;current=0;render();
}

function restartTest(){
  answers=new Array(150).fill(-1);submitted=false;reviewMode=false;current=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('test-screen').style.display='block';
  render();
}

render();
</script>
